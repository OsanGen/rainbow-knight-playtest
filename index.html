<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030205"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23251932'/%3E%3Ctext x='20' y='30' text-anchor='middle' font-size='30' fill='%23efa9e0'%3E✳%3C/text%3E%3C/svg%3E"><title>Rainbow Knight · Two Worlds</title>
<style>html,body{margin:0;background:#030205;color:#f9f4ed;font-family:Arial,sans-serif}#intro{position:fixed;inset:0;z-index:100;background:#030205;display:grid;place-items:center}#intro[hidden],[hidden]{display:none!important}.intro-card{text-align:center;font-size:clamp(30px,7vw,100px);line-height:1.05;margin:0;width:84%;font-weight:900}.intro-card span{display:block}.intro-prefix{font-size:.42em;letter-spacing:.05em;margin-bottom:.4em}.intro-controls{position:absolute;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;gap:16px}.intro-controls button{min-height:46px;padding:12px 18px;color:#f9f4ed;background:#0a0710;border:1px solid #9989ab;font:600 10px monospace;letter-spacing:1.4px}.intro-controls button:focus-visible{outline:2px solid #a9f6d8;outline-offset:4px}#boot-status{padding:32px;font:14px monospace}</style>

</head><body><div id="app"><p id="boot-status" role="status">Preparing the game. If it does not load, reload this page.</p></div>
<section id="intro" aria-label="Game introduction" tabindex="-1">
 <p id="intro-room-caption" role="status" aria-live="polite">Preparing the room…</p>
 <p id="intro-room-help" hidden></p>
 <span id="intro-crosshair" aria-hidden="true" hidden>+</span>
 <button id="intro-enter" type="button" hidden>ENTER APARTMENT</button>
 <button id="intro-play" type="button" hidden disabled>PLAY</button>
 <div id="intro-touch-controls" hidden aria-label="Apartment touch controls"><div id="intro-touch-move" aria-label="Drag to move">MOVE</div><div id="intro-touch-look" aria-label="Drag to look">LOOK</div></div>
 <h1 id="intro-title" class="intro-card" aria-label="COGSEC: Rainbow Knight" hidden aria-hidden="true"><span class="intro-prefix" aria-hidden="true">COGSEC:</span><span aria-hidden="true">RAINBOW KNIGHT</span></h1>
 <p id="intro-credit" class="intro-card" aria-label="Produced by OSAN Games" hidden><span class="intro-prefix" aria-hidden="true">PRODUCED BY</span><span aria-hidden="true">OSAN GAMES</span></p>
 <div class="intro-controls"><button id="intro-sound" type="button" aria-pressed="false" disabled>SOUND OFF</button><button id="intro-pause" type="button" hidden>PAUSE</button><button id="intro-skip" type="button">SKIP INTRO</button></div>
</section>
<script>
// The native shell is skippable before the game bundle or optional art is ready.
(()=>{const shell=document.getElementById('intro'),query=new URLSearchParams(location.search),held=new Set();
const bypass=query.get('intro')==='off'||query.get('intro')!=='on'&&(query.get('proof')==='1'||query.get('practice')==='boss'||['48','64'].includes(query.get('fixture')));
const skip=e=>{if(e){e.preventDefault();e.stopImmediatePropagation();}shell.dataset.skipRequested='true';document.getElementById('intro-room-caption').textContent='Preparing Level 1…';document.getElementById('intro-skip').disabled=true;};
const click=e=>{if(e.target.closest('#intro-skip'))skip(e);};
const sync=()=>{shell.dataset.heldKeys=[...held].join(',');};
const key=e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.code==='Tab')return;if(shell.hidden){if(held.has(e.code)){e.preventDefault();e.stopImmediatePropagation();}return;}held.add(e.code);sync();if(['Enter','Space'].includes(e.code)&&e.target.closest('#intro-skip'))return;e.preventDefault();e.stopImmediatePropagation();};
const up=e=>{if(held.delete(e.code)){sync();e.preventDefault();e.stopImmediatePropagation();}};
const blur=()=>{held.clear();sync();};
shell.addEventListener('click',click);window.addEventListener('keydown',key,true);window.addEventListener('keyup',up,true);window.addEventListener('blur',blur);
shell.addEventListener('intro:claimed',()=>{shell.removeEventListener('click',click);window.removeEventListener('keydown',key,true);window.removeEventListener('keyup',up,true);window.removeEventListener('blur',blur);},{once:true});
if(bypass)skip();})();
</script></body></html>
